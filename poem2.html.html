
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>劉禹錫－烏衣巷</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>烏衣巷</h1>
    <h2>唐代・劉禹錫</h2>

    <img src="https://ziyuan.guwendao.net/authorImg300/liuyuxi.jpg" alt="劉禹錫畫像">

    <div class="poem">
        <p>
            朱雀橋邊野草花，<br>
            烏衣巷口夕陽斜。<br>
            舊時王謝堂前燕，<br>
            飛入尋常百姓家。
        </p>
    </div>

    <p><a href="index.html">回個人首頁</a></p>
</body>
</html>

body {
    background-color: lightyellow;
    text-align: center;
}

h1 {
    color: red;
    font-size: 36pt;
}

.poem {
    color: brown;
    font-size: 24pt;
    line-height: 1.6;
}

img {
    width: 200px;
    border: 3px solid saddlebrown;
    border-radius: 20px;
}
