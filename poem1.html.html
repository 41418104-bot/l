    <h1>將進酒</h1>
    <h2>唐代・李白</h2>

    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/%E5%94%90%E5%90%8D%E8%87%A3%E5%83%8F-14-%E5%94%90%E7%BF%B0%E6%9E%97%E4%BE%9B%E5%A5%89%E6%9D%8E%E7%99%BD.jpg/250px-%E5%94%90%E5%90%8D%E8%87%A3%E5%83%8F-14-%E5%94%90%E7%BF%B0%E6%9E%97%E4%BE%9B%E5%A5%89%E6%9D%8E%E7%99%BD.jpg?utm_source=commons.wikimedia.org&utm_campaign=parser&utm_content=thumbnail" alt="李白畫像">

    <div class="poem">
        <p>
            君不見，黃河之水天上來，奔流到海不復回。<br>
            君不見，高堂明鏡悲白髮，朝如青絲暮成雪。<br>
            人生得意須盡歡，莫使金樽空對月。<br>
            天生我材必有用，千金散盡還復來。<br>
            烹羊宰牛且為樂，會須一飲三百杯。<br>
            岑夫子，丹丘生，將進酒，杯莫停。<br>
            與君歌一曲，請君為我傾耳聽。<br>
            鐘鼓饌玉不足貴，但願長醉不復醒。<br>
            古來聖賢皆寂寞，惟有飲者留其名。<br>
            陳王昔時宴平樂，斗酒十千恣歡謔。<br>
            主人何為言少錢，徑須沽取對君酌。<br>
            五花馬，千金裘，呼兒將出換美酒，<br>
            與爾同銷萬古愁。
        </p>
    </div>
